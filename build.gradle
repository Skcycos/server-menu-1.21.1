plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.sighs.cc/repository/maven-public/"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // JUnit 测试接入游戏运行环境：让测试可以使用真实 Minecraft/NeoForge 类
    // （FriendlyByteBuf/Netty 字节级 codec 往返测试需要真实网络缓冲）。
    unitTest {
        enable()
        testedMod = mods.named("${mod_id}")
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ApricityUI 硬依赖（NeoForge 1.21.1）——Pad 菜单 UI 全部由 AUI 渲染。
    // 服务端 dev 运行（./gradlew runServer -PserverOnly）不需要 AUI（客户端专属），
    // 此时降级为 compileOnly 避免 AUI 在专用服务器上被加载。
    if (project.hasProperty('serverOnly')) {
        compileOnly "com.sighs:ApricityUI-neoforge-1.21.1:1.2.3.1"
    } else {
        implementation "com.sighs:ApricityUI-neoforge-1.21.1:1.2.3.1"
    }

    // 三个业务 Mod 的公开 API 仅用于编译（compileOnly）：
    // - 运行时业务 Mod 保持可选（mods.toml 中为 optional），服务器缺少任一业务 Mod 也能启动；
    // - 业务 JAR 绝不进入 server-menu 的发布产物；
    // - 对应适配器只在确认 ModList.isLoaded 之后才通过白名单类名反射加载。
    compileOnly files(businessApiJars())

    // OAPC 的公开服务端/客户端 API 仅用于编译；OAPC 仍是可选 Mod，绝不打包进产物。
    compileOnly files(opacReferenceJar())

    // LuckPerms Developer API 仅用于编译；运行时没有 LuckPerms 时购买功能自动关闭。
    compileOnly files(luckPermsReferenceJar())

    // Lightman's Currency typed adapter 的编译依赖（compileOnly）：
    // - 只有 server/integration/lc 包引用 LC 类；api.economy 公共 API 绝不引用 LC；
    // - LC JAR 绝不进入 server-menu 的发布产物（compileOnly）；
    // - 适配器只在 ModList.isLoaded("lightmanscurrency") 且探针通过后反射加载。
    compileOnly files(lcReferenceJar())

    // Curios typed API 仅用于飞行戒指的可选装备槽适配；Curios JAR 不进入发布产物。
    compileOnly files(curiosReferenceJar())

    // Unit tests for pure menu logic
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 注册表/边界守卫测试的 mock 玩家（与 buildshop/stockmarket 保持一致）。
    testImplementation 'org.mockito:mockito-core:5.12.0'
    // Gson/slf4j 版本与 Minecraft 严格依赖保持一致（unitTest 接入 NeoForge 后
    // testCompileClasspath 含 neoforge 依赖，版本不一致会解析失败）。
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    // 测试用真实业务 JAR 验证：API 类存在、适配器结构、兼容性描述符与 jar 内容一致。
    // 仅用于测试（不进入发布产物）；纯 JUnit 环境不会加载业务 Mod（无 ModList）。
    testImplementation files(businessApiJars())
    // 测试用 LC 参考 JAR：描述符探针校验服务器安装的 LC API 签名与适配器所用反射名一致。
    testImplementation files(lcReferenceJar())
    // 测试用 Curios 参考 JAR：编译/装配 Curios 9.x 适配器，不打包进发布产物。
    testImplementation files(curiosReferenceJar())
}

// FML-JUnit 会在测试 JVM 中加载 classpath 上的全部 Mod；ApricityUI 是客户端专属 Mod，
// 在测试环境加载会失败（与 runServer 的 serverOnly 处理同理），测试运行时排除它。
configurations.testRuntimeClasspath {
    exclude group: 'com.sighs', module: 'ApricityUI-neoforge-1.21.1'
}

/**
 * 本地参考 JAR 解析（可移植，不依赖单一绝对路径）：
 *
 * 优先级 1) Gradle property：
 *     -PbuildshopJar=... / -PstockmarketJar=... / -PchineseOracleJar=... / -PlcJar=... / -PcuriosJar=... / -PopacJar=... / -PluckPermsJar=...
 *     （以及 -PserverModsDir=... 指定服务器 mods 目录）；
 * 优先级 2) 工作区相对路径（跨仓库目录曾迁移，保留历史路径兜底）；
 * 优先级 3) 本机服务器 mods 目录（-PserverModsDir 指定或本机已知路径）作最后兜底。
 *
 * 错误信息列出全部尝试过的路径与可用 property 名，便于换人/换机后自行指定；
 * 不以用户名或固定机器路径作为唯一方案。解析的 JAR 仅用于编译/测试，绝不打包。
 */

/** 本机服务器 mods 目录（最后兜底；可通过 -PserverModsDir 覆盖）。 */
def serverModsDir() {
    if (project.hasProperty("serverModsDir")) {
        def p = project.property("serverModsDir")
        if (p && project.file(p).isDirectory()) {
            return project.file(p)
        }
    }
    // 本机已知服务器安装路径（最后兜底；不是唯一方案）。
    def known = project.file(System.getProperty("user.home") + "/Desktop/Minecraft-Server/Server/mods")
    return known.isDirectory() ? known : null
}

/** 从目录里按文件名前缀挑一个存在的 JAR（目录候选用）。 */
def firstJarMatching(File dir, List<String> prefixes) {
    if (dir == null || !dir.isDirectory()) {
        return null
    }
    def files = dir.listFiles({ f -> f.isFile() && f.name.endsWith(".jar") } as FileFilter) ?: []
    for (def prefix : prefixes) {
        def hit = files.find { it.name.startsWith(prefix) }
        if (hit != null) {
            return hit
        }
    }
    return null
}

def resolveOptionalJar(String label, List<String> propertyNames, String fallbackFileName,
                       File dirCandidate, List<String> dirPrefixes) {
    // 1) Gradle property
    for (def prop : propertyNames) {
        if (project.hasProperty(prop)) {
            def given = (String) project.property(prop)
            if (given && project.file(given).exists()) {
                return project.file(given)
            }
        }
    }
    // 2) 目录候选（按前缀扫描，用于源码仓库 build/libs）
    if (dirCandidate != null) {
        def hit = firstJarMatching(dirCandidate, dirPrefixes)
        if (hit != null) {
            return hit
        }
    }
    // 3) 本机服务器 mods 目录兜底
    def modsDir = serverModsDir()
    if (modsDir != null && fallbackFileName != null) {
        def fallback = new File(modsDir, fallbackFileName)
        if (fallback.exists()) {
            return fallback
        }
    }
    throw new GradleException(
            "缺少 ${label} 参考 JAR。已尝试：" +
                    (propertyNames ? "properties ${propertyNames.join('/')}; " : "") +
                    (dirCandidate != null ? "目录 ${dirCandidate} 下 ${dirPrefixes.join('/')}*.jar; " : "") +
                    (modsDir != null ? "本机服务器 mods 目录 ${modsDir}/${fallbackFileName}" : "") +
                    "。可通过 -P${propertyNames ? propertyNames[0] : '?'}=/path/to/jar 显式指定。")
}

def businessApiJars() {
    def buildshop = resolveOptionalJar("buildshop",
            ["buildshopJar"], "buildshop-1.0.2.jar",
            project.file("../buildshop-1.21.1/build/libs"), ["buildshop-"])
    def stockmarket = resolveOptionalJar("stockmarket",
        ["stockmarketJar"], "stockmarket-1.0.1.jar",
            project.file("../stockmarket-1.21.1/build/libs"), ["stockmarket-"])
    def chinese = resolveOptionalJar("chinese_oracle",
            ["chineseOracleJar"], "chinese_oracle-1.0.0.jar",
            project.file("../chinese-oracle-1.21.1/build/libs"), ["chinese_oracle-"])
    return [buildshop, stockmarket, chinese]
}

// 服务器安装的 Lightman's Currency 参考 JAR：仅编译用（typed adapter 的 compileOnly，
// 绝不 bundling 进发布产物）与测试用（描述符探针校验真实 API 签名）。
def lcReferenceJar() {
    return resolveOptionalJar("lightmanscurrency",
            ["lcJar"], "[莱特曼货币]lightmanscurrency-1.21-2.3.0.5.jar",
            project.file("../LightmansCurrency/build/libs"), ["lightmanscurrency-"])
}

// Curios API 参考 JAR：仅用于可选 typed 适配器的编译与测试，绝不进入 server-menu 产物。
def curiosReferenceJar() {
    return resolveOptionalJar("curios",
            ["curiosJar"], "[饰品API]curios-neoforge-9.5.1+1.21.1.jar",
            project.file("../Curios/build/libs"), ["curios-neoforge-"])
}

// 服务器安装的 Open Parties and Claims 参考 JAR：仅编译用，绝不进入发布产物。
def opacReferenceJar() {
    return resolveOptionalJar("openpartiesandclaims",
            ["opacJar"], "open-parties-and-claims-neoforge-1.21.1-0.29.3.jar",
            project.file("../OpenPartiesAndClaims/NeoForge/build/libs"), ["open-parties-and-claims-neoforge-"])
}

// LuckPerms Developer API 参考 JAR：仅编译用，绝不进入发布产物。
def luckPermsReferenceJar() {
    return resolveOptionalJar("luckperms",
            ["luckPermsJar"], "LuckPerms-NeoForge-5.4.150.jar",
            project.file("../LuckPerms/build/libs"), ["LuckPerms-"])
}

test {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ApricityUI 是客户端 mod：专用服务端运行时不能加载它，但客户端运行仍需要它。
// 只有显式使用 -PserverOnly 时才从 run/mods 移除，避免 runClient 被破坏。
tasks.named('prepareServerRun').configure {
    def modsDir = layout.projectDirectory.dir('run/mods').asFile
    def serverOnlyRun = project.hasProperty('serverOnly')
    doLast {
        if (!serverOnlyRun) {
            return
        }
        modsDir.listFiles()?.each { f ->
            if (f.name.startsWith('ApricityUI-')) {
                f.delete()
            }
        }
    }
}
